<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KULA MYO Şampiyonlar Ligi</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>">
</head>
<body>
    <div id="particles"></div>
    
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">⚽ KULA MYO ŞAMPİYONLAR LİGİ</a>
            <ul class="nav-links">
                <li><a href="index.html" class="active">Ana Sayfa</a></li>
                <li><a href="gol-krallari.html">Gol Kralları</a></li>
                <li><a href="admin.html">Admin</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content container">
        <div id="live-score-section" class="live-score-hero slide-in-up">
            <span id="live-badge" class="live-badge">🔴 CANLI</span>
            <div id="match-status" class="match-status mt-4">İlk Yarı</div>
            
            <div class="score-display-container mt-4">
                <div class="team-info">
                    <span id="home-team-logo" class="team-logo">🛡️</span>
                    <span id="home-team-name" class="team-name">Ev Sahibi</span>
                </div>
                
                <div class="score-display">
                    <span id="home-score">0</span>
                    <span class="vs-text">:</span>
                    <span id="away-score">0</span>
                </div>
                
                <div class="team-info">
                    <span id="away-team-logo" class="team-logo">⚔️</span>
                    <span id="away-team-name" class="team-name">Deplasman</span>
                </div>
            </div>
            
            <div id="match-minute" class="match-minute mt-4">45'</div>
        </div>

        <div class="standings-section fade-in-up stagger-2">
            <h2 class="section-title">PUAN TABLOSU</h2>
            
            <div class="table-responsive">
                <table id="standings-table" class="standings-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Takım</th>
                            <th>O</th>
                            <th>G</th>
                            <th>B</th>
                            <th>M</th>
                            <th>AG</th>
                            <th>YG</th>
                            <th>AV</th>
                            <th>P</th>
                        </tr>
                    </thead>
                    <tbody id="standings-tbody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
            
            <div class="text-center mt-4">
                <a href="gol-krallari.html" class="btn btn-primary">👑 GOL KRALLARI</a>
            </div>
        </div>
    </main>

    <footer>
        © 2026 KULA MYO Şampiyonlar Ligi | Tüm hakları saklıdır
    </footer>

    <script src="js/animations.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
